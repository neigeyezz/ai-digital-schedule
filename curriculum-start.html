<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털 및 AI 기초 · 커리큘럼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .sites{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .note{
    background:var(--teal-soft);color:var(--teal);border-radius:var(--radius-card);
    padding:12px 16px;font-size:13px;margin-top:18px;
  }
  .round-table{margin-top:20px;border-collapse:separate;border-spacing:0;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;}
  .round-table th,.round-table td{padding:10px 12px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  .round-table th{background:var(--paper-deep);color:var(--ink-soft);font-size:12px;font-weight:700;}
  .round-table tr:last-child td{border-bottom:none;}
  .round-table td.no{font-family:'Noto Serif KR',serif;font-weight:700;color:var(--teal);width:34px;}
  .round-table td.date{white-space:nowrap;color:var(--ink-soft);}
  .cat-tag{font-size:10.5px;padding:2px 8px;border-radius:var(--radius-pill);background:var(--paper-deep);color:var(--ink-soft);white-space:nowrap;}
  @media (max-width:640px){
    .round-table{font-size:12px;}
    .round-table th,.round-table td{padding:8px 6px;}
  }
</style>
</head>
<body>
<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html">이현진 강사 스케줄</a>
    <div class="topnav-links">
      <a href="index.html">홈</a>
      <a href="calendar.html">월별 캘린더</a>
      <a href="curriculum-basic.html">스마트폰 기초교실</a>
      <a href="curriculum-ai.html">스마트폰 AI 활용교실</a>
      <a href="curriculum-start.html" class="active">디지털 및 AI 기초</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="kicker"><a class="back" href="index.html">← 스케줄 홈으로</a></div>
    <h1>디지털 및 AI 기초</h1>
    <p class="subtitle">총 15회차 공통 커리큘럼 (매주 화요일 10:00~12:00 기준)</p>
    <div class="sites" id="sites"></div>
    <div class="note">이 커리큘럼은 아래 4개 기관에서 공통으로 사용합니다. 날짜는 기준 회차표이며, 기관별 실제 시작일에 맞춰 회차 순서대로 조정해 진행하세요.</div>
  </div>

  <table class="round-table">
    <thead>
      <tr><th>회차</th><th>날짜</th><th>시간</th><th>구분</th><th>주제</th></tr>
    </thead>
    <tbody id="roundBody"></tbody>
  </table>

  <footer class="site-footer">회차별 소요시간은 2~3시간을 기준으로 합니다.</footer>
</div>

<script src="schedule-data.js"></script>
<script>
(function(){
  "use strict";
  var HJ = window.HJ;
  var data = HJ.load();
  var curriculum = HJ.CURRICULA.start;

  var sites = data.filter(function(it){ return it.topicKey==="start"; });
  document.getElementById("sites").innerHTML = sites.map(function(it){
    return '<span class="badge">'+HJ.esc(it.name)+' · '+HJ.esc(it.day)+'요일 '+HJ.esc(it.startTime)+'-'+HJ.esc(it.endTime)+'</span>';
  }).join("") || '<span class="badge solo">연결된 기관 없음</span>';

  document.getElementById("roundBody").innerHTML = curriculum.rounds.map(function(r){
    var d = HJ.parseDate(r.date);
    var dateLabel = d ? HJ.fmtDate(d) : r.date;
    return '<tr>'+
      '<td class="no">'+r.no+'</td>'+
      '<td class="date">'+dateLabel+'</td>'+
      '<td>'+HJ.esc(r.time)+'</td>'+
      '<td><span class="cat-tag">'+HJ.esc(r.category)+'</span></td>'+
      '<td>'+HJ.esc(r.title)+' <span style="color:var(--ink-faint);">('+HJ.esc(r.hours)+')</span></td>'+
    '</tr>';
  }).join("");
})();
</script>
</body>
</html>
